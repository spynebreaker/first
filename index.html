<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery | Home Exterior Projects</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <main class="page">
    <section class="gallery">
      <div class="gallery-hero">
        <div class="hero-content">
          <p class="hero-eyebrow">Gallery</p>
          <h1>Take a glimpse at our successful installations and witness the transformation we bring to every space.</h1>
          <button class="hero-button">Explore More</button>
        </div>
      </div>
      <div class="gallery-grid">
        <article class="gallery-card">
          <img src="https://images.unsplash.com/photo-1501183638710-841dd1904471?w=1200&q=80" alt="Modern home exterior in Golden" />
          <span class="gallery-label">Golden</span>
        </article>
        <article class="gallery-card">
          <img src="https://images.unsplash.com/photo-1449844908441-8829872d2607?w=1200&q=80" alt="Brick home exterior in Boulder" />
          <span class="gallery-label">Boulder</span>
        </article>
        <article class="gallery-card">
          <img src="https://images.unsplash.com/photo-1502005097973-6a7082348e28?w=1200&q=80" alt="Mountain lodge in Colorado Springs" />
          <span class="gallery-label">Colorado Springs</span>
        </article>
        <article class="gallery-card">
          <img src="https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?w=1200&q=80" alt="Craftsman home exterior in Denver" />
          <span class="gallery-label">Denver</span>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
